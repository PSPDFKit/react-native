/*
 *   Contains gradle configuration constants
 */
ext {
    NUTRIENT_VERSION = '11.6.4'
}

buildscript {
    // Nutrient's metadata is compiled with Kotlin 2.4, so an integrator's Kotlin version has to
    // be at least that. Anything older fails to read the SDK's .kotlin_module files.
    ext.kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion :
            rootProject.ext.has('kotlin_version') ? rootProject.ext.kotlin_version :
                    '2.4.10'

    repositories {
        mavenCentral()
        google()
        maven {
            url 'https://maven.google.com'
        }
    }

    dependencies {
        // Only used when this module is built on its own: inside an app, the app's Android Gradle
        // Plugin applies. React Native 0.86 and older can't run AGP 9, because their Gradle plugin
        // uses AGP 8-only APIs; React Native 0.87 and later can.
        classpath("com.android.tools.build:gradle:8.13.2")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

def nutrientVersionAtLeast = { String version, List<Integer> minimum ->
    def parts = version.tokenize('.-').take(3).collect { it.isInteger() ? it.toInteger() : 0 }
    while (parts.size() < 3) parts << 0
    for (int i = 0; i < 3; i++) {
        if (parts[i] != minimum[i]) return parts[i] > minimum[i]
    }
    return true
}
def appAgpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION

apply plugin: 'com.android.library'
// AGP 9 compiles Kotlin itself and refuses the kotlin-android plugin, unless the app opts out with
// `android.builtInKotlin=false` (as the React Native 0.87+ templates do).
if (!nutrientVersionAtLeast(appAgpVersion, [9, 0, 0]) || project.findProperty('android.builtInKotlin')?.toString() == 'false') {
    apply plugin: 'kotlin-android'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The app's own Android Gradle Plugin and Kotlin are the ones in use, not the versions above. With
// anything older than Nutrient needs, the build fails on `compileSdkMinor` or on Kotlin metadata,
// neither of which says to upgrade, so say it here.
def appKotlinVersion = org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project)
if (!nutrientVersionAtLeast(appAgpVersion, [8, 13, 0]) || !nutrientVersionAtLeast(appKotlinVersion, [2, 4, 10])) {
    throw new GradleException(
            "@nutrient-sdk/react-native needs Android Gradle Plugin 8.13 or later and Kotlin 2.4.10 or later, " +
                    "but this build uses Android Gradle Plugin $appAgpVersion and Kotlin $appKotlinVersion. " +
                    "Raise them in your app's Gradle files; the @nutrient-sdk/react-native changelog lists every " +
                    "toolchain version this release needs.")
}

def isNewArchitectureEnabled() {
    // To opt-in for the New Architecture, you can either:
    // - Set `newArchEnabled` to true inside the `gradle.properties` file
    // - Invoke gradle with `-newArchEnabled=true`
    // - Set an environment variable `ORG_GRADLE_PROJECT_newArchEnabled=true`
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}
android {
    compileSdk 37
    // API 37 ships as minor platform releases; Nutrient's AAR metadata requires android-37.1,
    // so both the major and the minor version have to be set or the build fails in
    // checkDebugAarMetadata before any source is compiled.
    compileSdkMinor 1

    namespace "com.pspdfkit.react"

    defaultConfig {
        minSdkVersion 24
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main {
            java.srcDirs = ["src/main/java"]
            // Conditionally include newarch sources only when New Architecture is enabled
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ["src/newarch/java"]
                // AGP 9's built-in Kotlin only takes the .java files from java.srcDirs, so without
                // this the Fabric view managers and events would silently be left out.
                kotlin.srcDirs += ["src/newarch/java"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

// Top level, not inside `android { }`: under AGP 9 the Kotlin toolchain is configured on the
// Kotlin extension. Nesting it only ever worked because Groovy resolved it against the project.
kotlin {
    jvmToolchain(17)
}

// IMPORTANT: Do not force Compose runtime versions here.
// Nutrient bundles/depends on a specific Compose runtime; forcing a mismatched version can lead to runtime
// NoSuchMethodError crashes (e.g. androidx.compose.runtime.Updater init-impl).

dependencies {
    // Nutrient Android SDK is published to Maven Central as `nutrient-android-sdk`.
    // The legacy `io.nutrient:nutrient` coordinate on https://my.nutrient.io/maven/ still
    // resolves during the transition period, but must not be combined with this one — both
    // on the classpath means duplicate classes.
    api("io.nutrient:nutrient-android-sdk:${NUTRIENT_VERSION}") {
        exclude group: 'com.google.auto.value', module: 'auto-value'
        exclude group: 'androidx.recyclerview', module: 'recyclerview'
    }

    implementation "com.facebook.react:react-native:+"

    // OkHttp dependencies
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation "androidx.recyclerview:recyclerview:1.4.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx3:1.7.3"

    // Let Nutrient manage Compose versions.

    // AI Assistant dependencies
    // Required at runtime by Nutrient's AI Assistant Compose UI (LocalViewModelStoreOwner).
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2"
    implementation("io.noties.markwon:core:4.6.2")
    implementation("io.noties.markwon:html:4.6.2")
    implementation("io.noties.markwon:linkify:4.6.2")
    implementation("io.noties.markwon:ext-tables:4.6.2")
    implementation("io.noties.markwon:ext-strikethrough:4.6.2")
    implementation("io.socket:socket.io-client:2.1.2")
}
